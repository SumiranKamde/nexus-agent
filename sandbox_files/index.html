<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus Shop | Modern E-commerce</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; }
        header { background: #333; color: #fff; padding: 1rem; text-align: center; }
        nav { display: flex; justify-content: center; background: #444; padding: 0.5rem; }
        nav a { color: white; margin: 0 15px; text-decoration: none; }
        .container { padding: 20px; display: flex; flex-wrap: wrap; gap: 20px; justify-content: center; }
        .product { border: 1px solid #ddd; padding: 15px; width: 200px; text-align: center; }
        footer { text-align: center; padding: 20px; background: #eee; margin-top: 20px; }
    </style>
</head>
<body>

<header>
    <h1>Nexus Shop</h1>
</header>

<nav>
    <a href="#">Home</a>
    <a href="#">Products</a>
    <a href="#">Cart</a>
</nav>

<div class="container">
    <div class="product">
        <h3>Product 1</h3>
        <p>$29.99</p>
        <button>Add to Cart</button>
    </div>
    <div class="product">
        <h3>Product 2</h3>
        <p>$49.99</p>
        <button>Add to Cart</button>
    </div>
    <div class="product">
        <h3>Product 3</h3>
        <p>$19.99</p>
        <button>Add to Cart</button>
    </div>
</div>

<footer>
    <p>&copy; 2023 Nexus Shop. All rights reserved.</p>
</footer>

</body>
</html>
